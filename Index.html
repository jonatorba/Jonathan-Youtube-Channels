<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan Youtube Channels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #f1f1f1;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .sub {
            color: #aaa;
            margin-bottom: 24px;
        }
        
        .category {
            margin-bottom: 48px;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #3a3a3a;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .category-title {
            font-size: 1.8rem;
            font-weight: 600;
        }
        .category-title.life { color: #4caf50; }
        .category-title.sports { color: #ff9800; }
        .category-title.learning { color: #2196f3; }
        .category-title.political { color: #f44336; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 20px;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .video-card:hover {
            transform: scale(1.02);
        }
        .video-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 1rem;
        }
        .video-channel {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        .video-date {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }
        .today-badge {
            background: #4caf50;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .yesterday-badge {
            background: #ff9800;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .add-section {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        input, select {
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        input {
            flex: 1;
        }
        select {
            width: 150px;
        }
        button {
            background: #3ea6ff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .remove-btn {
            background: #ff4d4d;
            padding: 4px 12px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        .channel-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        .channel-tag {
            background: #2a2a2a;
            padding: 6px 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .category-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .category-badge.life { background: #4caf50; }
        .category-badge.sports { background: #ff9800; }
        .category-badge.learning { background: #2196f3; }
        .category-badge.political { background: #f44336; }
        a {
            color: #3ea6ff;
            text-decoration: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .export-btn {
            background: #4caf50 !important;
        }
        .import-btn {
            background: #ff9800 !important;
        }
        .clear-btn {
            background: #ff4d4d !important;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📺 Jonathan Channels</h1>
    <div class="sub">Only today and yesterday's videos</div>

    <div class="add-section">
        <div class="input-group">
            <input type="text" id="channelInput" placeholder="YouTube Channel ID (e.g., UCXuqSBlHAE6Xw-yeJA0Tunw)">
            <select id="categorySelect">
                <option value="life">Life</option>
                <option value="sports">Sports</option>
                <option value="learning">Learning</option>
                <option value="political">Political</option>
            </select>
            <button id="addChannelBtn">➕ Add Channel</button>
        </div>
        <div id="channelsContainer" class="channel-list"></div>
        
        <!-- Export/Import Buttons -->
        <div class="button-group">
            <button id="exportBtn" class="export-btn">💾 Export Channels</button>
            <button id="importBtn" class="import-btn">📂 Import Channels</button>
            <button id="clearBtn" class="clear-btn">🗑️ Clear All</button>
        </div>
        
        <small style="color:#888; display: block; margin-top: 15px;">💡 How to get a Channel ID: <a href="#" id="howToLink" style="color:#3ea6ff">Click for instructions</a></small>
    </div>

    <div id="categoriesContainer"></div>
</div>

<script>
    const YOUTUBE_API_KEY = 'AIzaSyBh0niHD9l0gtge9Z8eMKIBBTvVKLfvcsE';
    
    let channels = [];
    
    const categories = ['life', 'sports', 'learning', 'political'];
    const categoryNames = {
        life: 'Life',
        sports: 'Sports',
        learning: 'Learning',
        political: 'Political'
    };
    
    let channelVideosCache = {};

    function loadChannels() {
        const saved = localStorage.getItem('jonathanChannelsWithCat');
        if (saved) {
            channels = JSON.parse(saved);
        } else {
            channels = [];
        }
        renderChannelTags();
        fetchAllCategoriesVideos();
    }

    function saveChannels() {
        localStorage.setItem('jonathanChannelsWithCat', JSON.stringify(channels));
    }

    async function addChannel() {
        const input = document.getElementById('channelInput');
        const category = document.getElementById('categorySelect').value;
        let channelId = input.value.trim();
        if (!channelId) return;

        if (!channelId.startsWith('UC')) {
            alert('Please enter a valid Channel ID (starts with "UC")');
            return;
        }

        if (channels.some(ch => ch.id === channelId)) {
            alert('This channel is already in your list');
            return;
        }

        const channelName = await fetchChannelName(channelId);
        if (!channelName) {
            alert('Could not fetch channel. Check your API key or Channel ID.');
            return;
        }

        channels.push({ id: channelId, name: channelName, category: category });
        saveChannels();
        renderChannelTags();
        input.value = '';
        channelVideosCache = {}; // Clear cache
        fetchAllCategoriesVideos();
    }

    async function fetchChannelName(channelId) {
        try {
            const url = `https://www.googleapis.com/youtube/v3/channels?part=snippet&id=${channelId}&key=${YOUTUBE_API_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.items && data.items[0]) {
                return data.items[0].snippet.title;
            }
            return null;
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    async function fetchChannelVideos(channelId, maxResults = 30) {
        if (channelVideosCache[channelId]) {
            return channelVideosCache[channelId];
        }
        
        try {
            const channelUrl = `https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}&key=${YOUTUBE_API_KEY}`;
            const channelRes = await fetch(channelUrl);
            const channelData = await channelRes.json();
            
            if (!channelData.items?.length) return [];
            
            const uploadsId = channelData.items[0].contentDetails.relatedPlaylists.uploads;
            const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=${maxResults}&playlistId=${uploadsId}&key=${YOUTUBE_API_KEY}`;
            const playlistRes = await fetch(playlistUrl);
            const playlistData = await playlistRes.json();
            
            if (!playlistData.items) return [];
            
            const videos = playlistData.items.map(item => ({
                id: item.snippet.resourceId.videoId,
                title: item.snippet.title,
                thumbnail: item.snippet.thumbnails.medium.url,
                publishedAt: item.snippet.publishedAt,
                videoUrl: `https://www.youtube.com/watch?v=${item.snippet.resourceId.videoId}`
            }));
            
            channelVideosCache[channelId] = videos;
            return videos;
        } catch (error) {
            console.error(error);
            return [];
        }
    }

    function isToday(dateString) {
        const videoDate = new Date(dateString);
        const today = new Date();
        return videoDate.toDateString() === today.toDateString();
    }
    
    function isYesterday(dateString) {
        const videoDate = new Date(dateString);
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        return videoDate.toDateString() === yesterday.toDateString();
    }

    async function fetchAllCategoriesVideos() {
        const container = document.getElementById('categoriesContainer');
        
        if (channels.length === 0) {
            container.innerHTML = '<div class="empty-state">📭 No channels added yet.<br>Add your first channel above.</div>';
            return;
        }

        container.innerHTML = '<div class="loading">Loading videos...</div>';
        
        const channelsByCategory = {};
        categories.forEach(cat => { channelsByCategory[cat] = []; });
        
        channels.forEach(ch => {
            if (channelsByCategory[ch.category]) {
                channelsByCategory[ch.category].push(ch);
            }
        });
        
        let html = '';
        
        for (const cat of categories) {
            const catChannels = channelsByCategory[cat];
            if (catChannels.length === 0) {
                html += `
                    <div class="category">
                        <div class="category-header">
                            <div class="category-title ${cat}">${categoryNames[cat]}</div>
                        </div>
                        <div class="empty-state" style="padding: 20px;">No channels in this category</div>
                    </div>
                `;
                continue;
            }
            
            let allVideos = [];
            for (const channel of catChannels) {
                const videos = await fetchChannelVideos(channel.id);
                allVideos.push(...videos.map(v => ({ ...v, channelName: channel.name })));
            }
            
            allVideos.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
            
            // FILTER: ONLY today OR yesterday videos
            const todaysVideos = allVideos.filter(v => isToday(v.publishedAt));
            const yesterdaysVideos = allVideos.filter(v => isYesterday(v.publishedAt));
            
            // Combine: today first, then yesterday
            const displayVideos = [...todaysVideos, ...yesterdaysVideos];
            
            const todayCount = todaysVideos.length;
            const yesterdayCount = yesterdaysVideos.length;
            
            if (displayVideos.length === 0) {
                html += `
                    <div class="category">
                        <div class="category-header">
                            <div class="category-title ${cat}">${categoryNames[cat]}</div>
                            <span style="color:#666;">No new videos today or yesterday</span>
                        </div>
                        <div class="empty-state" style="padding: 30px;">📭 No videos from the last 48 hours</div>
                    </div>
                `;
            } else {
                html += `
                    <div class="category">
                        <div class="category-header">
                            <div class="category-title ${cat}">${categoryNames[cat]}</div>
                            <span style="color:#888;">🎬 ${todayCount} today, ${yesterdayCount} yesterday</span>
                        </div>
                        <div class="video-grid" id="grid-${cat}">
                            ${renderVideoCards(displayVideos)}
                        </div>
                    </div>
                `;
            }
        }
        
        container.innerHTML = html;
    }
    
    function renderVideoCards(videos) {
        if (videos.length === 0) {
            return '<div class="empty-state" style="grid-column: 1/-1;">No videos available</div>';
        }
        
        return videos.map(video => {
            const isTodayVideo = isToday(video.publishedAt);
            const isYesterdayVideo = isYesterday(video.publishedAt);
            const badge = isTodayVideo ? '<span class="today-badge">NEW TODAY</span>' : (isYesterdayVideo ? '<span class="yesterday-badge">YESTERDAY</span>' : '');
            
            return `
                <a href="${video.videoUrl}" target="_blank" style="text-decoration: none; color: inherit;">
                    <div class="video-card">
                        <img src="${video.thumbnail}" alt="${escapeHtml(video.title)}">
                        <div class="video-info">
                            <div class="video-title">${escapeHtml(video.title)}${badge}</div>
                            <div class="video-channel">${escapeHtml(video.channelName)}</div>
                            <div class="video-date">${formatDate(video.publishedAt)}</div>
                        </div>
                    </div>
                </a>
            `;
        }).join('');
    }
    
    function formatDate(dateString) {
        const date = new Date(dateString);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        
        if (date.toDateString() === today.toDateString()) {
            return `Today at ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        } else if (date.toDateString() === yesterday.toDateString()) {
            return `Yesterday at ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        } else {
            return date.toLocaleDateString();
        }
    }

    function removeChannel(index) {
        channels.splice(index, 1);
        saveChannels();
        renderChannelTags();
        channelVideosCache = {};
        fetchAllCategoriesVideos();
    }

    function renderChannelTags() {
        const container = document.getElementById('channelsContainer');
        if (channels.length === 0) {
            container.innerHTML = '<div style="color:#666">No channels — add one above</div>';
            return;
        }
        container.innerHTML = channels.map((ch, idx) => `
            <div class="channel-tag">
                📺 ${escapeHtml(ch.name)}
                <span class="category-badge ${ch.category}">${categoryNames[ch.category]}</span>
                <button class="remove-btn" onclick="removeChannel(${idx})">✖</button>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== EXPORT / IMPORT FUNCTIONS ==========
    
    // Export channels to file
    document.getElementById('exportBtn')?.addEventListener('click', () => {
        if (channels.length === 0) {
            alert('No channels to export. Add some channels first.');
            return;
        }
        const data = JSON.stringify(channels, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `youtube-channels-backup-${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
        a.click();
        URL.revokeObjectURL(url);
        alert(`✅ Exported ${channels.length} channels successfully!`);
    });

    // Import channels from file
    document.getElementById('importBtn')?.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        // Validate each channel has required fields
                        let validCount = 0;
                        imported.forEach(ch => {
                            if (ch.id && ch.name && ch.category) {
                                validCount++;
                            }
                        });
                        channels = imported;
                        saveChannels();
                        renderChannelTags();
                        channelVideosCache = {};
                        fetchAllCategoriesVideos();
                        alert(`✅ Imported ${channels.length} channels successfully!`);
                    } else {
                        alert('Invalid file format. Not an array.');
                    }
                } catch (err) {
                    alert('Error parsing file. Make sure it\'s a valid JSON backup file.');
                }
            };
            reader.readAsText(file);
        };
        input.click();
    });

    // Clear all channels
    document.getElementById('clearBtn')?.addEventListener('click', () => {
        if (channels.length === 0) {
            alert('No channels to clear.');
            return;
        }
        if (confirm(`⚠️ Are you sure you want to delete ALL ${channels.length} channels? This cannot be undone.`)) {
            channels = [];
            saveChannels();
            renderChannelTags();
            channelVideosCache = {};
            fetchAllCategoriesVideos();
            alert('All channels cleared.');
        }
    });

    // Instructions for getting Channel ID
    document.getElementById('howToLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert("How to get a YouTube Channel ID:\n\n1. Go to any YouTube channel page\n2. Right-click → View Page Source\n3. Ctrl+F (or Cmd+F) and search for 'channelId'\n4. Copy the value (starts with UC...)\n\nOr use a site like commentpicker.com/youtube-channel-id.php");
    });

    document.getElementById('addChannelBtn').addEventListener('click', addChannel);
    document.getElementById('channelInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addChannel();
    });

    loadChannels();
</script>
</body>
</html>
